<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="480">
  <defs>
    <linearGradient id="scrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c10" stop-opacity="0.94" />
      <stop offset="55%" stop-color="#0d1117" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 32px;
      fill: #f0f6fc;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #8b949e;
    }
    .bullet {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      fill: #58a6ff;
    }
  </style>

  <!-- 1. Background Sketch Image -->
  <image href="./IMG_9488.png" x="0" y="0" width="850" height="480" preserveAspectRatio="xMidYMid slice" />

  <!-- 2. Dark contrast overlay -->
  <rect width="850" height="480" fill="url(#scrim)" />
  <rect width="850" height="480" fill="none" stroke="#30363d" stroke-width="1.5" rx="8" />

  <!-- 3. Text Overlay Content -->
  <g transform="translate(48, 52)">
    <text x="0" y="32" class="title">Hi there 👋</text>
    <text x="0" y="64" class="subtitle">Distributed Systems · Audio DSP · Backend Architecture</text>

    <g transform="translate(0, 115)">
      <circle cx="4" cy="4" r="3" fill="#58a6ff" />
      <text x="20" y="8" class="bullet">🔭 Building distributed backends, audio tools, and microservices.</text>

      <circle cx="4" cy="40" r="3" fill="#58a6ff" />
      <text x="20" y="44" class="bullet">🌱 Exploring kernel development, high-throughput caching, and low-level DSP.</text>

      <circle cx="4" cy="76" r="3" fill="#58a6ff" />
      <text x="20" y="80" class="bullet">💬 Ask me about: Python, Java, C, FastAPI, Redis, or bass tone shaping.</text>

      <circle cx="4" cy="112" r="3" fill="#58a6ff" />
      <text x="20" y="116" class="bullet">⚡ Fun fact: Playing bass in an indie band and sketching biomechanical forms.</text>
    </g>

    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="90" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="45" y="18" text-anchor="middle" class="tag">FastAPI</text>

      <rect x="100" y="0" width="85" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="142" y="18" text-anchor="middle" class="tag">Redis</text>

      <rect x="195" y="0" width="115" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="252" y="18" text-anchor="middle" class="tag">PostgreSQL</text>

      <rect x="320" y="0" width="90" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="365" y="18" text-anchor="middle" class="tag">Docker</text>

      <rect x="420" y="0" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="460" y="18" text-anchor="middle" class="tag">Java/C</text>
    </g>
  </g>
</svg>
